name: Code Standards

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8 and pylint
        run: pip install flake8 pylint

      - name: Run flake8
        run: flake8 student.py test_student.py

      - name: Run pylint
        run: pylint student.py test_student.py --fail-under=10

      - name: Run unit tests
        run: python -m unittest test_student -v
